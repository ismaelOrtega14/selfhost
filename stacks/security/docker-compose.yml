services:
  authentik-redis:
    image: redis:7-alpine
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - redis-authentik:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 3s

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    command: server
    restart: unless-stopped
    ports:
      - "9433:9443/tcp"
      - "9900:9000/tcp"
    volumes:
      - /home/ismael/authentik/media:/media
      - /home/ismael/authentik/custom-templates:/templates
    environment:
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: 192.168.0.251
      AUTHENTIK_POSTGRESQL__PORT: "5433"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import http.client, sys; c=http.client.HTTPConnection('localhost',9000); c.request('GET','/-/health/ready/'); sys.exit(0 if c.getresponse().status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pangolin_net
    networks:
      - default
      - pangolin_net
    depends_on:
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    command: worker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ismael/authentik/media:/media
      - /home/ismael/authentik/certs:/certs
      - /home/ismael/authentik/custom-templates:/templates
    environment:
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: 192.168.0.251
      AUTHENTIK_POSTGRESQL__PORT: "5433"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
    networks:
      - default
      - pangolin_net
    depends_on:
      authentik-redis:
        condition: service_healthy
      authentik-server:
        condition: service_healthy

volumes:
  redis-authentik:

networks:
  pangolin_net:
    external: true
