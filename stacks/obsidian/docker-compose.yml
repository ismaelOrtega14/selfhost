services:
  couchdb:
    image: couchdb:3
    restart: unless-stopped
    ports:
      - "5984:5984/tcp"
    volumes:
      - couchdb-data:/opt/couchdb/data
      - couchdb-etc:/opt/couchdb/etc/local.d
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    healthcheck:
      test: curl -sf http://127.0.0.1:5984/_up || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  couchdb-data:
  couchdb-etc:
