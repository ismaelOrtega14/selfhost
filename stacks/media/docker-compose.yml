services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    ports:
      - "9091:9091/tcp"
    volumes:
      - /home/ismael/transmission/config:/config
      - /home/ismael/downloads:/downloads
      - /home/ismael/transmission/torrents:/watch
    user: "1026"
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: Europe/Madrid
      USER: ismael
      PASS: ${TRANSMISSION_PASSWORD}
    networks:
      - default
      - pangolin_net
    healthcheck:
      test: curl -s http://127.0.0.1:9091 > /dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    networks:
      - pangolin_net
    healthcheck:
      test: curl -sf http://127.0.0.1:8191/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    restart: unless-stopped
    ports:
      - "9117:9117/tcp"
    volumes:
      - /home/ismael/jackett/config:/config
      - /home/ismael/jackettBlackhole:/downloads
    user: "1026"
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: Europe/Madrid
      AUTO_UPDATE: "true"
    networks:
      - default
      - pangolin_net
    healthcheck:
      test: curl -s http://127.0.0.1:9117 > /dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    ports:
      - "8989:8989/tcp"
    volumes:
      - /home/ismael/sonarr/config:/config
      - /home/ismael/downloads:/downloads
      - /home/ismael/tv:/tv
    user: "1026"
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: Europe/Madrid
    networks:
      - default
      - pangolin_net
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8989 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      transmission:
        condition: service_healthy

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    ports:
      - "7878:7878/tcp"
    volumes:
      - /home/ismael/radarr/config:/config
      - /home/ismael/downloads:/downloads
      - /home/ismael/movies:/movies
    user: "1026"
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: Europe/Madrid
    networks:
      - default
      - pangolin_net
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:7878 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      transmission:
        condition: service_healthy

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    ports:
      - "6767:6767/tcp"
    volumes:
      - /home/ismael/bazarr/config:/config
      - /home/ismael/movies:/movies
      - /home/ismael/tv:/tv
    user: "1026"
    environment:
      PUID: "1026"
      PGID: "100"
      TZ: Europe/Madrid
    networks:
      - default
      - pangolin_net
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:6767 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      transmission:
        condition: service_healthy

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    ports:
      - "5055:5055/tcp"
    user: "1026"
    volumes:
      - /home/ismael/seerr/config:/app/config
    dns: 192.168.0.250
    environment:
      PORT: 5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - default
      - pangolin_net
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

networks:
  pangolin_net:
    external: true
